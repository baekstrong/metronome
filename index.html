<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interval Metronome</title>
    <meta name="theme-color" content="#16233a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="메트로놈">
    <meta
      name="description"
      content="BPM 대신 초 단위로 반복음을 재생하는 인터벌 메트로놈"
    >
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-card">
        <p class="eyebrow">INTERVAL METRONOME</p>
        <h1>메트로놈</h1>
        <p class="hero-copy">
          BPM 계산 없이 원하는 초 간격만 정하면, 브라우저에서 바로 반복음을 재생합니다.
        </p>

        <div class="interval-panel">
          <div class="interval-header">
            <span class="label">Interval</span>
            <span id="intervalValue" class="interval-value">5</span>
            <span class="unit">sec</span>
          </div>
          <div class="wheel-picker" aria-label="Interval picker">
            <div class="wheel-cell">
              <div id="intervalColumn" class="wheel-column" tabindex="0" aria-label="Interval seconds"></div>
              <span class="wheel-cell-unit">sec</span>
            </div>
            <div class="wheel-highlight" aria-hidden="true"></div>
            <div class="wheel-fade wheel-fade-top" aria-hidden="true"></div>
            <div class="wheel-fade wheel-fade-bottom" aria-hidden="true"></div>
          </div>
        </div>

        <div class="volume-panel">
          <div class="volume-header">
            <span class="label">Volume</span>
            <span id="volumeValue" class="volume-value">50</span>
            <span class="unit">%</span>
          </div>
          <input
            id="volumeSlider"
            class="slider"
            type="range"
            min="0"
            max="100"
            step="1"
            value="50"
          >
          <div class="slider-scale">
            <span>0%</span>
            <span>100%</span>
          </div>
        </div>

        <div class="duration-panel">
          <div class="duration-header">
            <span class="label">Run Time</span>
            <span id="durationValue" class="duration-value">05:00</span>
          </div>
          <div class="wheel-picker" aria-label="Run time picker">
            <div class="wheel-cell">
              <div id="minColumn" class="wheel-column" tabindex="0" aria-label="Minutes"></div>
              <span class="wheel-cell-unit">min</span>
            </div>
            <div class="wheel-cell">
              <div id="secColumn" class="wheel-column" tabindex="0" aria-label="Seconds"></div>
              <span class="wheel-cell-unit">sec</span>
            </div>
            <div class="wheel-highlight" aria-hidden="true"></div>
            <div class="wheel-fade wheel-fade-top" aria-hidden="true"></div>
            <div class="wheel-fade wheel-fade-bottom" aria-hidden="true"></div>
          </div>
        </div>

        <div class="stats">
          <article class="stat-card">
            <p class="stat-label">Next Tick</p>
            <p><span id="countdownValue" class="stat-value">5.0</span><span class="stat-unit">sec</span></p>
          </article>
          <article class="stat-card">
            <p class="stat-label">Run Left</p>
            <p><span id="runRemainingValue" class="stat-value">05:00</span></p>
          </article>
          <article class="stat-card">
            <p class="stat-label">Played</p>
            <p><span id="playedValue" class="stat-value">0</span><span class="stat-unit">times</span></p>
          </article>
        </div>

        <div class="controls">
          <button id="startStopButton" class="button button-primary" type="button">Start</button>
          <button id="resetPlayedButton" class="button button-secondary" type="button">Reset Played</button>
        </div>

        <p id="statusText" class="status">브라우저 오디오 준비 전</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
  </html>
