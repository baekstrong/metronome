<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interval Metronome</title>
    <meta
      name="description"
      content="BPM 대신 초 단위로 반복음을 재생하는 인터벌 메트로놈"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-card">
        <p class="eyebrow">INTERVAL METRONOME</p>
        <h1>몇 초에 한 번씩 울리는 메트로놈</h1>
        <p class="hero-copy">
          BPM 계산 없이 원하는 초 간격만 정하면, 브라우저에서 바로 반복음을 재생합니다.
        </p>

        <div class="interval-panel">
          <div class="interval-header">
            <span class="label">Interval</span>
            <span id="intervalValue" class="interval-value">5.0</span>
            <span class="unit">sec</span>
          </div>
          <input
            id="intervalSlider"
            class="slider"
            type="range"
            min="0.5"
            max="30"
            step="0.5"
            value="5"
          >
          <div class="slider-scale">
            <span>0.5s</span>
            <span>30s</span>
          </div>
        </div>

        <div class="stats">
          <article class="stat-card">
            <p class="stat-label">Next Tick</p>
            <p><span id="countdownValue" class="stat-value">5.0</span><span class="stat-unit">sec</span></p>
          </article>
          <article class="stat-card">
            <p class="stat-label">Played</p>
            <p><span id="playedValue" class="stat-value">0</span><span class="stat-unit">times</span></p>
          </article>
        </div>

        <div class="controls">
          <button id="startStopButton" class="button button-primary" type="button">Start</button>
          <button id="previewButton" class="button button-secondary" type="button">Preview</button>
        </div>

        <p id="statusText" class="status">브라우저 오디오 준비 전</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
  </html>
